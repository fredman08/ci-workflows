<svg viewBox="0 0 900 240" width="900" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ci-workflows — define-once CI that runs on every repo: lint, security scan, review, merge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a28"/>
      <stop offset="1" stop-color="#0f2638"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="240" fill="url(#bg)"/>
  <rect width="900" height="240" fill="url(#grid)"/>

  <!-- ===================== LEFT: identity ===================== -->
  <!-- pipeline/branch glyph -->
  <g transform="translate(46,52)" stroke="#56c596" stroke-width="2.6" fill="none">
    <circle cx="6" cy="8" r="5" fill="#0c1a28"/>
    <circle cx="6" cy="36" r="5" fill="#0c1a28"/>
    <circle cx="34" cy="22" r="5" fill="#0c1a28"/>
    <path d="M6 13 V31 M6 22 H18 Q29 22 29 20 L29 27" stroke-linecap="round"/>
  </g>

  <text x="100" y="86" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="39" font-weight="700" fill="#eaf1f6" letter-spacing="-0.5">ci-workflows</text>
  <rect x="101" y="98" width="268" height="3" rx="1.5" fill="#56c596"/>

  <text x="101" y="129" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="15.5" fill="#9fb2c2">define once, runs on every repo</text>
  <text x="101" y="156" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="12.5" fill="#6f8496">semgrep security,  ruff/eslint lint,  coderabbit review</text>

  <!-- ===================== RIGHT: the CI pipeline ===================== -->
  <!-- rail -->
  <line x1="455" y1="120" x2="835" y2="120" stroke="#33495f" stroke-width="2.5"/>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8ea2b2" text-anchor="middle">

    <!-- gate 1: lint -->
    <g>
      <circle cx="500" cy="120" r="19" fill="#12283a" stroke="#2f4a60" stroke-width="2.6">
        <animate attributeName="stroke" keyTimes="0;0.15;0.17;0.86;0.90;1"
          values="#2f4a60;#2f4a60;#56c596;#56c596;#2f4a60;#2f4a60" dur="8s" repeatCount="indefinite"/>
      </circle>
      <path d="M491 120 l6 6 l12 -13" fill="none" stroke="#7ad6ab" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0">
        <animate attributeName="opacity" keyTimes="0;0.15;0.17;0.86;0.90;1" values="0;0;1;1;0;0" dur="8s" repeatCount="indefinite"/>
      </path>
      <text x="500" y="158">lint</text>
    </g>

    <!-- gate 2: scan -->
    <g>
      <circle cx="615" cy="120" r="19" fill="#12283a" stroke="#2f4a60" stroke-width="2.6">
        <animate attributeName="stroke" keyTimes="0;0.36;0.38;0.86;0.90;1"
          values="#2f4a60;#2f4a60;#56c596;#56c596;#2f4a60;#2f4a60" dur="8s" repeatCount="indefinite"/>
      </circle>
      <path d="M606 120 l6 6 l12 -13" fill="none" stroke="#7ad6ab" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0">
        <animate attributeName="opacity" keyTimes="0;0.36;0.38;0.86;0.90;1" values="0;0;1;1;0;0" dur="8s" repeatCount="indefinite"/>
      </path>
      <text x="615" y="158">scan</text>
    </g>

    <!-- gate 3: review -->
    <g>
      <circle cx="730" cy="120" r="19" fill="#12283a" stroke="#2f4a60" stroke-width="2.6">
        <animate attributeName="stroke" keyTimes="0;0.58;0.60;0.86;0.90;1"
          values="#2f4a60;#2f4a60;#56c596;#56c596;#2f4a60;#2f4a60" dur="8s" repeatCount="indefinite"/>
      </circle>
      <path d="M721 120 l6 6 l12 -13" fill="none" stroke="#7ad6ab" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0">
        <animate attributeName="opacity" keyTimes="0;0.58;0.60;0.86;0.90;1" values="0;0;1;1;0;0" dur="8s" repeatCount="indefinite"/>
      </path>
      <text x="730" y="158">review</text>
    </g>

    <!-- merge node -->
    <g>
      <circle cx="835" cy="120" r="16" fill="#12283a" stroke="#2f4a60" stroke-width="2.6">
        <animate attributeName="stroke" keyTimes="0;0.78;0.80;0.90;0.94;1"
          values="#2f4a60;#2f4a60;#56c596;#56c596;#2f4a60;#2f4a60" dur="8s" repeatCount="indefinite"/>
      </circle>
      <!-- git-merge glyph -->
      <g stroke="#7ad6ab" stroke-width="2.2" fill="none" opacity="0.85">
        <circle cx="829" cy="114" r="2.6" fill="#7ad6ab" stroke="none"/>
        <circle cx="829" cy="127" r="2.6" fill="#7ad6ab" stroke="none"/>
        <circle cx="842" cy="120" r="2.6" fill="#7ad6ab" stroke="none"/>
        <path d="M829 116 V125 M829 120 Q829 120 840 120" stroke-linecap="round"/>
      </g>
      <text x="835" y="152">merge</text>
    </g>

    <!-- the PR token flowing through the pipeline -->
    <g>
      <rect x="440" y="107" width="30" height="26" rx="7" fill="#4a7bb0"/>
      <text x="455" y="124" fill="#eaf1f6" font-size="11" font-weight="700">PR</text>
      <animateTransform attributeName="transform" type="translate"
        keyTimes="0;0.08;0.80;0.88;1" values="0,0; 0,0; 380,0; 380,0; 0,0"
        dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" keyTimes="0;0.05;0.85;0.90;1" values="0;1;1;0;0" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
