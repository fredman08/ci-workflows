name: Lint
on:
  workflow_call:
    inputs:
      soft-fail:
        description: "true = report issues but do NOT fail the build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Detect and lint stacks (whole repo)
        shell: bash
        env:
          SOFT_FAIL: ${{ inputs.soft-fail }}
        run: |
          set -uo pipefail
          status=0
          if find . -path ./node_modules -prune -o -name '*.py' -print 2>/dev/null | grep -q .; then
            echo "::group::Python (ruff)"
            python -m pip install --quiet 'ruff>=0.6,<1'
            ruff check . || status=1
            echo "::endgroup::"
          fi
          if [ -f package.json ]; then
            echo "::group::Node (eslint + tsc)"
            npm install --no-audit --no-fund --loglevel=error || status=1
            npm run lint --if-present || status=1
            if [ -f tsconfig.json ]; then npx --yes tsc --noEmit || status=1; fi
            echo "::endgroup::"
          fi
          if [ "$SOFT_FAIL" = "true" ]; then exit 0; fi
          exit "$status"
