name: Semgrep OSS
on:
  workflow_call:
    inputs:
      config:
        description: "Semgrep ruleset(s), e.g. 'auto', 'p/default', or 'p/default p/security-audit'"
        type: string
        default: "auto"
      soft-fail:
        description: "true = report findings but do NOT fail the build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  semgrep:
    name: scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        env:
          SEMGREP_CONFIGS: ${{ inputs.config }}
          SOFT_FAIL: ${{ inputs.soft-fail }}
        run: |
          args=()
          for c in $SEMGREP_CONFIGS; do args+=(--config "$c"); done
          [ "$SOFT_FAIL" = "true" ] || args+=(--error)
          semgrep scan "${args[@]}"
