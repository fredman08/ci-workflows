name: Semgrep OSS
on:
  workflow_call:
    inputs:
      config:
        description: "Semgrep ruleset(s), e.g. 'auto', 'p/default', or 'p/default p/security-audit'"
        type: string
        default: "auto"
      soft-fail:
        description: "true = report findings but do NOT fail the build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  semgrep:
    name: scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        env:
          SEMGREP_CONFIGS: ${{ inputs.config }}
          SOFT_FAIL: ${{ inputs.soft-fail }}
        run: |
          set --
          for c in $SEMGREP_CONFIGS; do set -- "$@" --config "$c"; done
          [ "$SOFT_FAIL" = "true" ] || set -- "$@" --error
          semgrep scan "$@"
